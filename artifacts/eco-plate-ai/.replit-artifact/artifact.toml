kind = "web"
previewPath = "/"
title = "EcoPlate AI"
version = "1.0.0"
id = "artifacts/eco-plate-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21184

[services.development]
run = "pnpm --filter @zeroplate/eco-plate-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@zeroplate/eco-plate-ai", "run", "build" ]
publicDir = "artifacts/eco-plate-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
VITE_PORT = "21184"
VITE_BASE_PATH = "/"
